<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASO Doctor: free live app store diagnosis</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/inter-ui/3.19.3/inter.css">
<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root{
  --bg:#f6f7f9;
  --surface:#ffffff;
  --surface-alt:#fafbfc;
  --navy:#0f1b33;
  --navy-2:#16233f;
  --navy-3:#1e2c4d;
  --border:#e3e6ec;
  --border-strong:#d3d8e2;
  --text:#141a2b;
  --text-dim:#5a6478;
  --text-faint:#8891a3;
  --teal:#0d9488;
  --teal-dark:#0a7268;
  --teal-light:#e6f6f4;
  --indigo:#4f46e5;
  --indigo-light:#eeecfd;
  --green:#16a34a;
  --green-light:#e9f9ee;
  --amber:#d97706;
  --amber-light:#fef3e2;
  --orange:#ea580c;
  --orange-light:#fef0e7;
  --red:#dc2626;
  --red-light:#fdecec;
  --purple:#7c3aed;
  --purple-light:#f3ecfe;
  --gold:#b8860b;
  --gold-light:#fbf3e0;
  --radius-sm:8px;
  --radius:12px;
  --radius-lg:16px;
  --shadow-sm:0 1px 2px rgba(15,27,51,0.06);
  --shadow:0 2px 8px rgba(15,27,51,0.08);
  --shadow-lg:0 12px 32px rgba(15,27,51,0.14);
  --font-display:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-mono:'SF Mono',Consolas,'Roboto Mono',monospace;
  --sidebar-w:250px;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-body);
  background:var(--bg);
  color:var(--text);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,h5{margin:0;font-family:var(--font-display);font-weight:700;letter-spacing:-0.01em;}
p{margin:0;}
button{font-family:inherit;cursor:pointer;}
a{color:inherit;text-decoration:none;}
ul{margin:0;padding:0;list-style:none;}
table{border-collapse:collapse;width:100%;}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;}
img{max-width:100%;display:block;}

/* ============================================================
   DEMO BANNER
   ============================================================ */
#demoBanner{
  position:fixed;bottom:14px;left:14px;z-index:9999;
  background:var(--navy);color:#fff;font-size:11px;font-weight:600;
  padding:7px 12px;border-radius:20px;letter-spacing:.02em;
  box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:6px;
  opacity:.94;
}
#demoBanner .dot{width:6px;height:6px;border-radius:50%;background:var(--teal);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}

/* ============================================================
   LAYOUT: APP SHELL
   ============================================================ */
#appShell{display:none;min-height:100vh;}
#appShell.active{display:flex;}

.sidebar{
  width:var(--sidebar-w);flex-shrink:0;background:var(--navy);color:#cbd3e6;
  display:flex;flex-direction:column;height:100vh;position:sticky;top:0;overflow-y:auto;
}
.sidebar-logo{
  display:flex;align-items:center;gap:10px;padding:20px 18px;border-bottom:1px solid rgba(255,255,255,.08);
}
.sidebar-logo .mark{
  width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--teal),var(--indigo));
  display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;
}
.sidebar-logo .name{font-family:var(--font-display);font-weight:800;color:#fff;font-size:15px;}
.sidebar-logo .sub{font-size:10px;color:#8290ad;letter-spacing:.04em;text-transform:uppercase;}
.sidebar-nav{flex:1;padding:10px 10px 16px;}
.nav-section-label{
  font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#5c6785;
  padding:16px 12px 6px;font-weight:700;
}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;
  font-size:13px;font-weight:500;color:#c2c9dc;margin-bottom:1px;position:relative;
  border:none;background:none;width:100%;text-align:left;
}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav-item.active{background:linear-gradient(90deg,rgba(13,148,136,.25),rgba(13,148,136,.05));color:#fff;}
.nav-item.active::before{content:'';position:absolute;left:-10px;top:6px;bottom:6px;width:3px;background:var(--teal);border-radius:2px;}
.nav-item .ic{width:16px;text-align:center;flex-shrink:0;opacity:.85;font-size:13px;}
.nav-item .pm{
  margin-left:auto;font-size:9px;font-weight:800;background:linear-gradient(135deg,var(--purple),var(--gold));
  color:#fff;padding:2px 6px;border-radius:20px;letter-spacing:.03em;
}
.sidebar-foot{padding:12px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#7482a0;}

.main-col{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh;overflow-y:auto;}

.topbar{
  position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--border);
  padding:10px 24px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.topbar-select{
  display:flex;align-items:center;gap:6px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;
  font-size:12.5px;font-weight:600;background:var(--surface-alt);color:var(--text);
}
.topbar-select .chev{color:var(--text-faint);font-size:9px;}
.spacer{flex:1;}
.plan-toggle{display:flex;background:var(--surface-alt);border:1px solid var(--border);border-radius:20px;padding:3px;gap:2px;}
.plan-toggle button{
  border:none;background:none;padding:6px 13px;border-radius:16px;font-size:12px;font-weight:700;color:var(--text-dim);
}
.plan-toggle button.active.free{background:var(--navy);color:#fff;}
.plan-toggle button.active.premium{background:linear-gradient(135deg,var(--purple),var(--gold));color:#fff;}
.icon-btn{
  width:34px;height:34px;border-radius:8px;border:1px solid var(--border);background:var(--surface);
  display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--text-dim);position:relative;
}
.icon-btn:hover{background:var(--surface-alt);}
.icon-btn .badge-dot{position:absolute;top:5px;right:5px;width:7px;height:7px;background:var(--red);border-radius:50%;border:1.5px solid var(--surface);}
.avatar{
  width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--indigo),var(--teal));
  color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;
}
.devnotes-btn{
  border:1px dashed var(--border-strong);background:var(--surface);border-radius:8px;padding:6px 11px;
  font-size:11.5px;font-weight:700;color:var(--text-dim);
}
.devnotes-btn.active{background:var(--indigo);border-color:var(--indigo);color:#fff;border-style:solid;}

.page-wrap{padding:22px 26px 60px;max-width:1400px;}
.breadcrumbs{font-size:12px;color:var(--text-faint);margin-bottom:6px;font-weight:600;}
.breadcrumbs b{color:var(--text-dim);}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:22px;flex-wrap:wrap;}
.page-title{font-size:23px;margin-bottom:4px;}
.page-desc{font-size:13px;color:var(--text-dim);max-width:640px;}
.page-actions{display:flex;gap:8px;flex-wrap:wrap;}

.btn{
  padding:9px 16px;border-radius:8px;font-size:13px;font-weight:700;border:1px solid transparent;
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
}
.btn-primary{background:var(--teal);color:#fff;}
.btn-primary:hover{background:var(--teal-dark);}
.btn-secondary{background:var(--surface);color:var(--text);border-color:var(--border-strong);}
.btn-secondary:hover{background:var(--surface-alt);}
.btn-ghost{background:none;color:var(--text-dim);}
.btn-ghost:hover{color:var(--text);}
.btn-sm{padding:6px 11px;font-size:12px;}
.btn-danger{background:var(--red);color:#fff;}
.btn:disabled{opacity:.5;cursor:not-allowed;}

/* ============================================================
   COMPONENTS
   ============================================================ */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow-sm);}
.card-title{font-size:14px;font-weight:700;margin-bottom:2px;}
.card-sub{font-size:12px;color:var(--text-faint);margin-bottom:12px;}
.grid{display:grid;gap:16px;}
.grid-2{grid-template-columns:repeat(2,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-5{grid-template-columns:repeat(5,1fr);}
@media(max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-5{grid-template-columns:repeat(3,1fr);}.grid-3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:640px){.grid-2,.grid-3,.grid-4,.grid-5{grid-template-columns:1fr;}}

.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;position:relative;}
.stat-label{font-size:11.5px;color:var(--text-faint);font-weight:700;text-transform:uppercase;letter-spacing:.03em;display:flex;align-items:center;justify-content:space-between;}
.stat-value{font-size:26px;font-weight:800;font-family:var(--font-display);margin-top:6px;letter-spacing:-0.02em;}
.stat-value small{font-size:13px;font-weight:600;color:var(--text-faint);}
.stat-trend{font-size:12px;font-weight:700;margin-top:5px;display:flex;align-items:center;gap:4px;}
.trend-up{color:var(--green);}
.trend-down{color:var(--red);}
.trend-flat{color:var(--text-faint);}

.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;}
.badge-verified{background:var(--green-light);color:var(--green);}
.badge-manual{background:var(--indigo-light);color:var(--indigo);}
.badge-estimated{background:var(--amber-light);color:var(--amber);}
.badge-inferred{background:var(--purple-light);color:var(--purple);}
.badge-unavailable{background:#f1f2f5;color:var(--text-faint);}
.badge-critical{background:var(--red-light);color:var(--red);}
.badge-high{background:var(--orange-light);color:var(--orange);}
.badge-medium{background:var(--amber-light);color:var(--amber);}
.badge-low{background:var(--indigo-light);color:var(--indigo);}
.badge-good{background:var(--green-light);color:var(--green);}
.badge-neutral{background:#f1f2f5;color:var(--text-dim);}
.badge-premium{background:linear-gradient(135deg,var(--purple),var(--gold));color:#fff;}
.badge-free{background:var(--teal-light);color:var(--teal-dark);}
.badge-outline{background:none;border:1px solid var(--border-strong);color:var(--text-dim);}
.ev-dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0;}

.gauge-wrap{position:relative;width:150px;height:150px;margin:0 auto;}
.gauge-wrap svg{transform:rotate(-90deg);}
.gauge-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.gauge-num{font-size:32px;font-weight:800;font-family:var(--font-display);}
.gauge-lbl{font-size:10.5px;color:var(--text-faint);font-weight:700;text-transform:uppercase;letter-spacing:.03em;}

.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.bar-row .lbl{width:140px;font-size:12.5px;color:var(--text-dim);font-weight:600;flex-shrink:0;}
.bar-track{flex:1;height:8px;background:#eef0f4;border-radius:6px;overflow:hidden;}
.bar-fill{height:100%;border-radius:6px;}
.bar-row .val{width:34px;text-align:right;font-size:12.5px;font-weight:700;flex-shrink:0;}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:18px;overflow-x:auto;}
.tab{padding:10px 16px;font-size:13px;font-weight:700;color:var(--text-faint);border-bottom:2px solid transparent;white-space:nowrap;background:none;border-top:none;border-left:none;border-right:none;}
.tab.active{color:var(--teal-dark);border-bottom-color:var(--teal);}

.issue-card{border:1px solid var(--border);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;background:var(--surface);}
.issue-head{padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;}
.issue-head:hover{background:var(--surface-alt);}
.issue-sev-bar{width:4px;align-self:stretch;border-radius:3px;flex-shrink:0;}
.issue-title{font-weight:700;font-size:13.5px;flex:1;}
.issue-meta{font-size:11.5px;color:var(--text-faint);margin-top:2px;}
.issue-body{padding:0 18px 18px;border-top:1px solid var(--border);display:none;}
.issue-body.open{display:block;padding-top:14px;}
.issue-body dl{display:grid;grid-template-columns:150px 1fr;gap:8px 14px;font-size:13px;margin:0 0 14px;}
.issue-body dt{color:var(--text-faint);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.02em;}
.issue-body dd{margin:0;color:var(--text);}
.chev-ic{transition:transform .15s;color:var(--text-faint);}
.issue-head.open .chev-ic{transform:rotate(90deg);}

.table-wrap{overflow-x:auto;}
table.dtable{font-size:13px;}
table.dtable th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--text-faint);font-weight:700;padding:8px 12px;border-bottom:1px solid var(--border);white-space:nowrap;}
table.dtable td{padding:11px 12px;border-bottom:1px solid var(--border);vertical-align:middle;white-space:nowrap;}
table.dtable tr:last-child td{border-bottom:none;}
table.dtable tr:hover td{background:var(--surface-alt);}

.modal-overlay{position:fixed;inset:0;background:rgba(15,20,35,.5);display:none;align-items:center;justify-content:center;z-index:200;padding:20px;}
.modal-overlay.active{display:flex;}
.modal{background:var(--surface);border-radius:var(--radius-lg);max-width:480px;width:100%;box-shadow:var(--shadow-lg);max-height:88vh;overflow-y:auto;}
.modal-head{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.modal-body{padding:20px;}
.modal-foot{padding:16px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}
.modal-x{background:none;border:none;font-size:18px;color:var(--text-faint);width:28px;height:28px;border-radius:6px;}
.modal-x:hover{background:var(--surface-alt);}

.toast-wrap{position:fixed;top:18px;right:18px;z-index:300;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--navy);color:#fff;padding:12px 16px;border-radius:9px;font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:8px;min-width:220px;animation:toastin .2s ease;}
@keyframes toastin{from{transform:translateY(-8px);opacity:0;}to{transform:translateY(0);opacity:1;}}

.empty-state{text-align:center;padding:50px 20px;color:var(--text-faint);}
.empty-state .ic{font-size:34px;margin-bottom:10px;}
.empty-state h4{color:var(--text);margin-bottom:5px;font-size:15px;}
.empty-state p{font-size:12.5px;max-width:340px;margin:0 auto;}

.skeleton{background:linear-gradient(90deg,#eceff3 25%,#f6f7f9 37%,#eceff3 63%);background-size:400% 100%;animation:sk 1.4s infinite;border-radius:8px;}
@keyframes sk{0%{background-position:100% 0;}100%{background-position:0 0;}}

.upgrade-lock{
  position:relative;border-radius:var(--radius);overflow:hidden;
}
.upgrade-lock .lock-content{filter:blur(4px);pointer-events:none;user-select:none;opacity:.7;}
.upgrade-overlay{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  background:rgba(255,255,255,.55);text-align:center;padding:20px;
}
.upgrade-overlay .lockic{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--purple),var(--gold));color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;}
.upgrade-overlay h4{font-size:14px;}
.upgrade-overlay p{font-size:12px;color:var(--text-dim);max-width:280px;}

.devnote{
  display:none;background:var(--navy-2);color:#a7f3d0;font-family:var(--font-mono);font-size:10.5px;
  padding:8px 10px;border-radius:7px;margin:6px 0;line-height:1.6;border:1px dashed rgba(255,255,255,.2);
}
body.devnotes .devnote{display:block;}
.devnote b{color:#fff;}
.devnote .req{color:#93c5fd;}

.kanban{display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));gap:14px;overflow-x:auto;padding-bottom:10px;}
.kanban-col{background:var(--surface-alt);border-radius:var(--radius);padding:12px;min-width:220px;}
.kanban-col h5{font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--text-dim);margin-bottom:10px;display:flex;justify-content:space-between;}
.kanban-card{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:11px;margin-bottom:9px;box-shadow:var(--shadow-sm);}
.kanban-card .kc-title{font-size:12.5px;font-weight:700;margin-bottom:6px;}
.kanban-card .kc-meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px;}

.timeline{position:relative;padding-left:26px;}
.timeline::before{content:'';position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--border);}
.tl-item{position:relative;margin-bottom:20px;}
.tl-item::before{content:'';position:absolute;left:-26px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--teal);border:2px solid var(--surface);box-shadow:0 0 0 2px var(--teal);}
.tl-date{font-size:11px;color:var(--text-faint);font-weight:700;}
.tl-title{font-weight:700;font-size:13.5px;margin:3px 0 3px;}
.tl-desc{font-size:12.5px;color:var(--text-dim);}

.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:20px;border:1px solid var(--border-strong);background:var(--surface);font-size:12px;font-weight:600;color:var(--text-dim);}
.chip.active{background:var(--navy);color:#fff;border-color:var(--navy);}

input[type=text],input[type=email],input[type=password],input[type=number],select,textarea{
  width:100%;padding:10px 12px;border:1px solid var(--border-strong);border-radius:8px;font-size:13px;
  font-family:inherit;background:var(--surface);color:var(--text);
}
label.flabel{font-size:12px;font-weight:700;color:var(--text-dim);display:block;margin-bottom:5px;}
.field{margin-bottom:14px;}

.progress-bar{height:6px;background:#eef0f4;border-radius:4px;overflow:hidden;}
.progress-bar .fill{height:100%;background:var(--teal);border-radius:4px;transition:width .3s;}

.mobile-mock{width:220px;background:#0f1115;border-radius:28px;padding:8px;box-shadow:var(--shadow-lg);}
.mobile-mock .screen{background:#fff;border-radius:20px;overflow:hidden;aspect-ratio:9/19.5;position:relative;}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media(max-width:900px){
  .sidebar{position:fixed;left:-260px;z-index:100;transition:left .2s;box-shadow:var(--shadow-lg);}
  .sidebar.open{left:0;}
  #menuToggle{display:flex !important;}
  .page-wrap{padding:16px;}
  .kanban{grid-template-columns:repeat(5,240px);}
}
@media(min-width:901px){#menuToggle{display:none;}}
@media(max-width:640px){
  .topbar{padding:10px 14px;}
  .topbar-select span.full{display:none;}
}

#appShell{display:flex}
.sidebar-foot a{color:#9fb0d8}
.stack{display:flex;flex-direction:column;gap:10px}
.cand{display:flex;gap:12px;align-items:center;padding:10px;border:1px solid var(--border);border-radius:10px;background:var(--surface);cursor:pointer;text-align:left;width:100%}
.cand:hover{border-color:var(--teal)}
.cand img,.ico{width:44px;height:44px;border-radius:10px;flex-shrink:0;background:var(--border)}
input.in,select.in{font:inherit;padding:10px 12px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface);color:var(--text);min-width:0}
.scanrow{display:flex;gap:10px;flex-wrap:wrap}
.scanrow .grow{flex:1;min-width:240px}
.fixbox{margin-top:8px;padding:9px 12px;border-left:3px solid var(--teal);background:var(--teal-light);border-radius:0 8px 8px 0;font-size:13px}
.shots{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.shots img{height:190px;border-radius:10px;border:1px solid var(--border)}
td,th{padding:9px 10px;border-bottom:1px solid var(--border);text-align:left;font-size:13px;vertical-align:middle}
th{color:var(--text-dim);font-weight:600}
.err{color:var(--red);font-weight:600;margin-top:10px}
@media(max-width:900px){.sidebar{position:fixed;left:-270px;z-index:100;transition:left .2s}.sidebar.open{left:0}.grid-2,.grid-3,.grid-4{grid-template-columns:1fr!important}#mt{display:flex!important}.page-wrap{padding-top:56px}}
#mt{display:none;position:fixed;top:12px;left:12px;z-index:120;width:38px;height:38px;border-radius:9px;background:var(--navy);color:#fff;border:none;align-items:center;justify-content:center}
</style></head><body>
<button id="mt" aria-label="Menu" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
<div id="appShell">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo"><div class="mark">🩺</div><div><div class="name">ASO Doctor</div><div class="sub">Live data · Free</div></div></div>
    <nav class="sidebar-nav" id="nav"></nav>
    <div class="sidebar-foot">Data from public store sources. Search volume and the iOS keyword field are private, so they are never estimated here.</div>
  </aside>
  <div class="main-col"><main class="page-wrap" id="main"></main></div>
</div>
<div class="toast-wrap" id="toastWrap"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=async(p,q)=>{const r=await fetch('/api/'+p+'?'+new URLSearchParams(q));let j;try{j=await r.json()}catch(e){throw new Error('Server error. Try again.')}if(!r.ok)throw new Error(j.error||'Request failed');return j};
const W=s=>(String(s||'').toLowerCase().match(/[a-z0-9]+/g)||[]);
const STOP=new Set('a an the and or of for to in on with by your you my is it at as app apps this that are be from we our can will all more get just not but have has was too very so if its into out up'.split(' '));
const stem=w=>w.replace(/ies$/,'y').replace(/s$/,'');
const col=v=>v>=75?'var(--green)':v>=50?'var(--amber)':'var(--red)';
const S={app:null,rev:[],sug:[],comp:[],ranks:{},screen:'scan',kw:'',cc:'us',busy:'',err:'',cands:null};
const NAV=[['scan','➕','New Scan'],['health','🩺','ASO Health'],['metadata','📝','Metadata'],['keywords','🔑','Keywords'],['reviews','⭐','Ratings & Reviews'],['competitors','⚔️','Competitors']];
function toast(m){const e=document.createElement('div');e.className='toast';e.innerHTML='<span>✓</span> '+esc(m);$('#toastWrap').appendChild(e);setTimeout(()=>e.remove(),2800)}
function go(id){S.screen=id;document.getElementById('sidebar').classList.remove('open');render();$('.main-col').scrollTo(0,0)}
function gauge(v,l,size){const r=62,c=2*Math.PI*r,k=col(v);return `<div class="gauge-wrap" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}" viewBox="0 0 150 150"><circle cx="75" cy="75" r="${r}" fill="none" stroke="#eef0f4" stroke-width="12"/><circle cx="75" cy="75" r="${r}" fill="none" stroke="${k}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c-v/100*c}" transform="rotate(-90 75 75)"/></svg><div class="gauge-center"><div class="gauge-num" style="color:${k}">${v}</div><div class="gauge-lbl">${esc(l)}</div></div></div>`}
const bar=(l,v)=>`<div class="bar-row"><div class="lbl">${esc(l)}</div><div class="bar-track"><div class="bar-fill" style="width:${v}%;background:${col(v)}"></div></div><div class="val">${v}</div></div>`;
const days=d=>d?Math.floor((Date.now()-new Date(d))/864e5):null;
const head=(t,d,a)=>`<div class="page-head"><div><h1 class="page-title">${t}</h1><p class="page-desc">${d}</p></div><div class="page-actions">${a||''}</div></div>`;

/* ---------- derive main keyword ---------- */
function mainKw(a){if(S.kw.trim())return S.kw.trim().toLowerCase();
 const t=a.name||'',m=t.split(/\s[-–—:|]\s|:\s/);if(m.length>1&&m[1].trim())return m[1].trim().toLowerCase();
 return (a.category||'').toLowerCase()}

/* ---------- diagnosis engine ---------- */
function diagnose(a){
 const I=[],cat={Metadata:100,Keywords:100,Visuals:100,Ratings:100,Technical:100};
 const hit=(c,pts,sev,area,title,why,fix)=>{cat[c]=Math.max(0,cat[c]-pts);I.push({c,sev,area,title,why,fix,pts})};
 const ios=a.store==='ios',kw=mainKw(a),kwp=W(kw).join(' '),t=a.name||'',s=a.subtitle||'',d=a.description||'';
 const vis=(t+' '+s).toLowerCase();
 if(t.length<20)hit('Metadata',22,'high','Title',`Title uses only ${t.length} of 30 characters`,'The title carries the most ranking weight on both stores. Unused characters are free keywords you are not claiming.','Extend it to "Brand: Main Keyword" style, up to 30 characters.');
 if(kwp&&!(t.toLowerCase().includes(kwp)))hit('Metadata',26,'critical','Title',`Main keyword "${kw}" is not in the title`,'Stores weigh title words highest. Without it, ranking for this term is an uphill fight.',`Put "${kw}" in the title, ideally right after the brand name.`);
 if(ios){
  if(!s)hit('Metadata',22,'high','Subtitle','No subtitle found','The subtitle is indexed and shown in search results. An empty one gives up 30 indexed characters.','Add a subtitle that states the benefit and uses a second keyword.');
  else{
   if(s.length<20)hit('Metadata',8,'medium','Subtitle',`Subtitle uses only ${s.length} of 30 characters`,'Short subtitles leave indexed space unused.','Use the full 30 characters.');
   const tw=W(t).map(stem),rep=W(s).filter(w=>w.length>3&&tw.includes(stem(w)));
   if(rep.length)hit('Metadata',9,'medium','Subtitle',`Subtitle repeats title words (${rep.slice(0,3).join(', ')})`,'Apple already indexes your title, so repeated words add nothing.','Replace repeats with new keywords.');
  }
 }
 if(d.length<500)hit('Metadata',10,'medium','Description',`Description is short (${d.length} characters)`,'Short descriptions convert poorly and, on Google Play, rank poorly.','Write 1,500+ characters: problem, outcome, key features, social proof.');
 if(kwp&&!d.slice(0,170).toLowerCase().includes(W(kw)[0]||'~~'))hit('Metadata',6,'low','Description','Main keyword missing from the first lines','Only the first lines show before "more", so that is where users decide.','Open with your keyword and a clear promise.');
 // keywords
 const sug=S.sug;
 if(sug.length){const cov=sug.filter(x=>W(x).every(w=>vis.includes(w)||STOP.has(w))).length,pct=Math.round(cov/sug.length*100);
  if(pct<35)hit('Keywords',Math.min(55,Math.round((35-pct)*1.6)+25),pct<15?'critical':'high','Keywords',`Only ${pct}% of real store suggestions appear in your title and subtitle`,'These are phrases the store autocompletes, so people really type them. Your visible metadata covers few of them.','Work the uncovered suggestions on the Keywords screen into title and subtitle.');
 }else hit('Keywords',10,'low','Keywords','Could not load store suggestions','Keyword coverage could not be checked this scan.','Rescan later.');
 const rk=S.ranks[kwp];
 if(kwp&&rk===null)hit('Keywords',30,'high','Rank',`Not in the top 200 for "${kw}"`,'Verified with a live store search. Users rarely scroll that far.','Fix title and subtitle first, then re-check rank.');
 else if(kwp&&rk>20)hit('Keywords',14,'medium','Rank',`Ranks #${rk} for "${kw}"`,'Below the first screen of results, so most users never see you.','Strengthen title keyword placement and ratings velocity.');
 // visuals
 const n=a.screenshots.length;
 if(n<3)hit('Visuals',55,'critical','Screenshots',`Only ${n} screenshot(s)`,'Screenshots decide most installs.','Upload at least 6. First 3 should sell outcomes with bold captions.');
 else if(n<6)hit('Visuals',25,'high','Screenshots',`Only ${n} screenshots`,'You are not using the full gallery to sell.','Add up to 8 to 10, with the best three first.');
 // ratings
 if(!a.ratingCount)hit('Ratings',60,'high','Ratings','No ratings yet','No social proof lowers conversion.','Prompt happy users for a rating right after a win.');
 else{
  if(a.rating<4)hit('Ratings',45,'critical','Ratings',`Average rating ${a.rating} is below 4.0`,'Under 4.0 hurts conversion and store ranking.','Read recent 1 and 2 star reviews, fix the top complaint, reply publicly.');
  else if(a.rating<4.5)hit('Ratings',18,'medium','Ratings',`Average rating ${a.rating}`,'4.5+ converts noticeably better.','Reply to negative reviews and prompt satisfied users.');
  if(a.ratingCount<100)hit('Ratings',22,'medium','Ratings',`Only ${a.ratingCount} ratings`,'Low volume feels risky to new users.','Add an in-app review prompt at a success moment.');
  if(a.ratingCurrent&&a.rating-a.ratingCurrent>=0.4)hit('Ratings',20,'high','Ratings',`Current version rates ${a.ratingCurrent} vs ${a.rating} overall`,'A recent release is hurting sentiment.','Check reviews for the latest version and ship a fix.');
 }
 // technical
 const u=days(a.updated);
 if(u!==null&&u>180)hit('Technical',45,'high','Freshness',`Last update ${u} days ago`,'Stale apps lose trust and store favor.','Ship an update with real release notes.');
 else if(u!==null&&u>90)hit('Technical',22,'medium','Freshness',`Last update ${u} days ago`,'Updates signal an active app.','Plan a release soon.');
 if(ios&&a.languages&&a.languages<3)hit('Technical',20,'medium','Localization',`App supports only ${a.languages} language(s)`,'Each extra store locale gives more indexed keyword slots.','Localize metadata for your biggest markets.');
 if(ios&&(a.releaseNotes||'').length<30)hit('Technical',10,'low','Release notes','Release notes are missing or thin','Notes show on your page and affect trust.','Write short, specific notes.');
 const w={Metadata:.3,Keywords:.25,Visuals:.2,Ratings:.15,Technical:.1};
 const score=Math.round(Object.keys(w).reduce((s,k)=>s+cat[k]*w[k],0));
 const order={critical:0,high:1,medium:2,low:3};I.sort((x,y)=>order[x.sev]-order[y.sev]||y.pts-x.pts);
 return {score,cat,I,kw}}

/* ---------- data loading ---------- */
async function loadApp(q){
 S.busy='Fetching live listing…';S.err='';S.cands=null;render();
 try{
  const a=await api('app',{q,cc:S.cc});
  if(a.candidates){S.busy='';S.cands=a.candidates;if(!a.candidates.length)S.err='No apps found. Try the exact name or paste the store link.';render();return}
  S.app=a;S.ranks={};S.rev=[];S.sug=[];S.comp=[];
  const kw=mainKw(a),ios=a.store==='ios';
  S.busy='Pulling keywords, reviews and competitors…';render();
  const seeds=[...new Set([kw,W(a.name)[0],(a.category||'').toLowerCase()].filter(Boolean))].slice(0,3);
  const [sg,rv,cp,rk]=await Promise.all([
   Promise.all(seeds.map(t=>api('suggest',{term:t,cc:S.cc,store:a.store}).then(r=>r.terms).catch(()=>[]))),
   ios?api('reviews',{id:a.id,cc:S.cc}).then(r=>r.reviews).catch(()=>[]):[],
   api('search',{term:kw||a.name,cc:S.cc,limit:12}).then(r=>r.results).catch(()=>[]),
   ios&&kw?api('rank',{id:a.id,term:kw,cc:S.cc}).then(r=>r.rank).catch(()=>undefined):undefined]);
  S.sug=[...new Set(sg.flat())].slice(0,24);S.rev=rv;S.comp=cp.filter(c=>c.id!==a.id);
  const kp=W(kw).join(' ');if(rk!==undefined)S.ranks[kp]=rk;
  S.busy='';go('health');
 }catch(e){S.busy='';S.err=e.message;render()}}

/* ---------- screens ---------- */
const V={};
V.scan=()=>`${head('New Scan','Paste an App Store or Google Play link, a package name, or just type the app name. Everything below is pulled live.')}
<div class="card"><div class="scanrow"><input class="in grow" id="q" placeholder="https://apps.apple.com/us/app/…  or  com.example.app  or  app name" value="${esc($('#q')?$('#q').value:'')}" onkeydown="if(event.key==='Enter')doScan()">
<input class="in" id="kw" placeholder="Main keyword (optional)" value="${esc(S.kw)}">
<select class="in" id="cc">${[['us','🇺🇸 US'],['gb','🇬🇧 UK'],['ca','🇨🇦 Canada'],['au','🇦🇺 Australia'],['de','🇩🇪 Germany'],['fr','🇫🇷 France'],['in','🇮🇳 India'],['pk','🇵🇰 Pakistan'],['ae','🇦🇪 UAE'],['br','🇧🇷 Brazil']].map(o=>`<option value="${o[0]}" ${o[0]===S.cc?'selected':''}>${o[1]}</option>`).join('')}</select>
<button class="btn btn-primary" onclick="doScan()" ${S.busy?'disabled':''}>Run diagnosis</button></div>
${S.busy?`<p class="card-sub" style="margin-top:12px">${esc(S.busy)}</p>`:''}${S.err?`<div class="err">${esc(S.err)}</div>`:''}</div>
${S.cands?`<div class="stack" style="margin-top:14px"><div class="card-title">Which app?</div>${S.cands.map(c=>`<button class="cand" onclick="loadApp('id${esc(c.id)}')"><img src="${esc(c.icon)}" alt=""><div><b>${esc(c.name)}</b><div class="card-sub">${esc(c.developer)} · ★ ${c.rating?c.rating.toFixed(1):'–'} (${c.ratingCount.toLocaleString()})</div></div></button>`).join('')}</div>`:''}
<p class="card-sub" style="margin-top:16px">Tip: paste the link for the most accurate match. For Google Play, data is best effort.</p>`;
function doScan(){S.kw=$('#kw').value;S.cc=$('#cc').value;const q=$('#q').value.trim();if(!q){S.err='Enter an app link or name.';render();return}loadApp(q)}

function need(f){return S.app?f():`${head('Nothing scanned yet','Run a scan first.')}<div class="empty-state"><h4>No app loaded</h4><button class="btn btn-primary" onclick="go('scan')">Scan an app</button></div>`}
const appHead=a=>`<div class="card" style="display:flex;gap:14px;align-items:center;margin-bottom:18px"><img class="ico" src="${esc(a.icon)}" alt=""><div><b style="font-size:16px">${esc(a.name)}</b><div class="card-sub">${esc(a.developer)} · ${esc(a.category)} · ${a.store==='ios'?'App Store':'Google Play'} · ${esc(S.cc.toUpperCase())}${a.updated?' · updated '+days(a.updated)+'d ago':''}</div></div></div>`;

V.health=()=>need(()=>{const a=S.app,r=diagnose(a),sevc={critical:'var(--red)',high:'var(--orange)',medium:'var(--amber)',low:'var(--indigo)'};
 const cnt=k=>r.I.filter(i=>i.sev===k).length;
 return `${head('ASO Health Report','Live diagnosis from the public listing, ranked by impact.',`<button class="btn btn-secondary" onclick="copyReport()">📋 Copy report</button><button class="btn btn-primary" onclick="loadApp('${a.store==='ios'?'id'+a.id:a.id}')">↻ Rescan</button>`)}${appHead(a)}
<div class="grid" style="grid-template-columns:220px 1fr;gap:20px;margin-bottom:20px;align-items:center"><div class="card" style="text-align:center">${gauge(r.score,'Overall health',170)}</div>
<div class="card"><div class="card-title">Score by category</div>${Object.keys(r.cat).map(k=>bar(k,r.cat[k])).join('')}</div></div>
<div class="grid grid-4" style="margin-bottom:20px">${['critical','high','medium','low'].map(k=>`<div class="stat-card" style="border-color:${sevc[k]}"><div class="stat-label">${k[0].toUpperCase()+k.slice(1)}</div><div class="stat-value" style="color:${sevc[k]}">${cnt(k)}</div></div>`).join('')}</div>
<h3 style="font-size:16px;margin-bottom:12px">Diagnosed issues, biggest first</h3>
${r.I.length?r.I.map(i=>`<div class="card" style="margin-bottom:10px;border-left:4px solid ${sevc[i.sev]}"><div style="display:flex;justify-content:space-between;gap:10px"><b>${esc(i.title)}</b><span class="badge badge-neutral">${esc(i.area)} · ${i.sev}</span></div><p class="card-sub" style="margin-top:6px">${esc(i.why)}</p><div class="fixbox"><b>Fix:</b> ${esc(i.fix)}</div></div>`).join(''):'<div class="card">No issues found. Healthy listing.</div>'}
${a.note?`<p class="card-sub" style="margin-top:14px">${esc(a.note)}</p>`:''}`});
function copyReport(){const r=diagnose(S.app);const t=`ASO Doctor report: ${S.app.name}\nScore: ${r.score}/100\n\n`+r.I.map(i=>`[${i.sev.toUpperCase()}] ${i.title}\n  Why: ${i.why}\n  Fix: ${i.fix}`).join('\n\n');
 (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Report copied')).catch(()=>{const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();try{document.execCommand('copy');toast('Report copied')}catch(e){}x.remove()})}

V.metadata=()=>need(()=>{const a=S.app,kw=mainKw(a),ios=a.store==='ios',t=a.name||'',s=a.subtitle||'',d=a.description||'';
 const freq={};W(d).forEach(w=>{if(!STOP.has(w)&&w.length>2)freq[w]=(freq[w]||0)+1});const top=Object.entries(freq).sort((x,y)=>y[1]-x[1]).slice(0,14);
 const brand=t.split(/\s[-–—:|]\s|:\s/)[0].trim();
 const field=(l,v,max)=>`<div class="card" style="margin-bottom:12px"><div class="card-title">${l} <span class="badge ${v.length>max?'badge-critical':v.length>=max*0.7?'badge-good':'badge-medium'}">${v.length} / ${max}</span></div><div style="font-size:15px">${v?esc(v):'<i style="color:var(--text-faint)">Not found</i>'}</div></div>`;
 return `${head('Metadata Analyzer','What the store indexes today, and how well it uses your space.')}${appHead(a)}
${field('Title',t,30)}${ios?field('Subtitle',s,30):''}
<div class="card" style="margin-bottom:12px"><div class="card-title">Description <span class="badge badge-neutral">${d.length} characters${ios?' · not indexed on iOS':' · indexed'}</span></div><p style="font-size:13px;color:var(--text-dim);white-space:pre-wrap;max-height:180px;overflow:auto">${esc(d)}</p></div>
<div class="grid grid-2"><div class="card"><div class="card-title">Main keyword "${esc(kw)}" placement</div>${[['Title',t],['Subtitle',s],['Description opening',d.slice(0,170)]].map(x=>{const ok=W(kw).length&&W(kw).every(w=>x[1].toLowerCase().includes(w));return `<div style="padding:6px 0">${ok?'✅':'❌'} ${x[0]}</div>`}).join('')}</div>
<div class="card"><div class="card-title">Most used words in description</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">${top.map(x=>`<span class="chip">${esc(x[0])} · ${x[1]}</span>`).join('')||'–'}</div></div></div>
<div class="card" style="margin-top:12px"><div class="card-title">Title pattern to test</div><p style="font-size:15px;margin-top:6px"><b>${esc((brand+': '+kw).slice(0,30))}</b></p><p class="card-sub">Starting point only. Keep the brand recognizable and the keyword natural. Max 30 characters.</p></div>
${ios?'<p class="card-sub" style="margin-top:12px">Apple\'s 100 character keyword field is private, so it cannot be read from outside. Ask the app owner for it.</p>':''}`});

V.keywords=()=>need(()=>{const a=S.app,vis=((a.name||'')+' '+(a.subtitle||'')).toLowerCase();
 const rows=S.sug.map((x,i)=>({x,i,cov:W(x).every(w=>vis.includes(w)||STOP.has(w))}));
 return `${head('Keyword Intelligence','Real autocomplete suggestions from the store, checked against your visible metadata, with live rank checks.')}${appHead(a)}
<div class="card"><div class="card-title">Store suggestions <span class="badge badge-verified">live</span></div><p class="card-sub">Earlier in the list usually means more searched. Exact search volume is private, so none is shown.</p>
<div class="table-wrap"><table><tr><th>Suggestion</th><th>In title / subtitle</th><th>Your rank</th><th></th></tr>
${rows.map(r=>{const k=W(r.x).join(' '),rk=S.ranks[k];return `<tr><td><b>${esc(r.x)}</b></td><td>${r.cov?'<span class="badge badge-good">covered</span>':'<span class="badge badge-high">gap</span>'}</td><td>${rk===undefined?'–':rk===null?'200+':'#'+rk}</td><td>${a.store==='ios'&&rk===undefined?`<button class="btn btn-secondary btn-sm" onclick="chk('${esc(r.x).replace(/'/g,'')}',this)">Check rank</button>`:''}</td></tr>`}).join('')||'<tr><td colspan="4">No suggestions returned.</td></tr>'}</table></div></div>
${a.store==='ios'?'<p class="card-sub" style="margin-top:12px">Rank = position in a live App Store search (top 200 checked). It can vary slightly by device and account.</p>':''}`});
async function chk(t,b){b.disabled=true;b.textContent='Checking…';try{const r=await api('rank',{id:S.app.id,term:t,cc:S.cc});S.ranks[W(t).join(' ')]=r.rank}catch(e){toast('Check failed')}render()}

V.reviews=()=>need(()=>{const a=S.app,R=S.rev;
 if(a.store!=='ios')return `${head('Ratings & Reviews','')}${appHead(a)}<div class="card">Review feeds are available for App Store apps only. Overall rating: ★ ${a.rating} (${a.ratingCount.toLocaleString()})</div>`;
 const dist=[5,4,3,2,1].map(n=>R.filter(x=>x.rating===n).length),neg=R.filter(x=>x.rating<=3),f={};
 neg.forEach(x=>new Set(W(x.title+' '+x.text)).forEach(w=>{if(!STOP.has(w)&&w.length>3)f[w]=(f[w]||0)+1}));
 const th=Object.entries(f).sort((x,y)=>y[1]-x[1]).slice(0,10);
 return `${head('Ratings & Reviews','Latest public reviews and what unhappy users complain about.')}${appHead(a)}
<div class="grid grid-3" style="margin-bottom:18px"><div class="stat-card"><div class="stat-label">Overall rating</div><div class="stat-value">★ ${a.rating}</div></div><div class="stat-card"><div class="stat-label">Total ratings</div><div class="stat-value">${a.ratingCount.toLocaleString()}</div></div><div class="stat-card"><div class="stat-label">Current version</div><div class="stat-value">${a.ratingCurrent?'★ '+a.ratingCurrent:'–'}</div></div></div>
${R.length?`<div class="grid grid-2" style="margin-bottom:18px;align-items:start"><div class="card"><div class="card-title">Latest ${R.length} reviews</div>${[5,4,3,2,1].map((n,i)=>`<div class="bar-row"><div class="lbl">${n} ★</div><div class="bar-track"><div class="bar-fill" style="width:${R.length?dist[i]/R.length*100:0}%;background:${n>=4?'var(--green)':n===3?'var(--amber)':'var(--red)'}"></div></div><div class="val">${dist[i]}</div></div>`).join('')}</div>
<div class="card"><div class="card-title">Words in 1 to 3 star reviews</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">${th.map(x=>`<span class="chip">${esc(x[0])} · ${x[1]}</span>`).join('')||'None. Great sign.'}</div><p class="card-sub" style="margin-top:10px">Frequency only. Read the reviews to judge whether each is a product issue or a listing expectation issue.</p></div></div>
<div class="stack">${R.slice(0,12).map(x=>`<div class="card"><b>${'★'.repeat(x.rating)}${'☆'.repeat(5-x.rating)} ${esc(x.title)}</b><p class="card-sub" style="margin-top:4px">${esc(x.text.slice(0,320))}</p></div>`).join('')}</div>`:'<div class="card">No public reviews returned for this country store.</div>'}`});

V.competitors=()=>need(()=>{const a=S.app,C=S.comp,kw=mainKw(a),mx=Math.max(a.ratingCount,...C.map(c=>c.ratingCount),1);
 return `${head('Competitor Intelligence',`Top apps for "${esc(kw)}" in a live store search, compared to yours.`)}${appHead(a)}
<div class="card" style="margin-bottom:16px"><div class="card-title">Rating volume (social proof)</div>
<div class="bar-row"><div class="lbl">${esc(a.name.slice(0,20))}</div><div class="bar-track"><div class="bar-fill" style="width:${a.ratingCount/mx*100}%;background:var(--teal)"></div></div><div class="val">${a.ratingCount.toLocaleString()}</div></div>
${C.slice(0,8).map(c=>`<div class="bar-row"><div class="lbl">${esc(c.name.slice(0,20))}</div><div class="bar-track"><div class="bar-fill" style="width:${c.ratingCount/mx*100}%;background:#c7cddc"></div></div><div class="val">${c.ratingCount.toLocaleString()}</div></div>`).join('')}</div>
